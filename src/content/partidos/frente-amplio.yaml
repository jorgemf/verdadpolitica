resumen: "Sus partidos, agrupados como Sumar, fueron durante toda la legislatura el socio minoritario del Gobierno de coalición con el PSOE, con cinco ministerios: Trabajo (vicepresidencia segunda), Sanidad, Cultura, Derechos Sociales y Consumo, y Juventud e Infancia. IU gobierna en coalición con el PSOE en Asturias desde 2023. Concurre al 29-N como coalición de IU, Movimiento Sumar, Más Madrid y Catalunya en Comú, con Ada Colau de candidata; Podemos concurre por separado."
nota: "Su historial en la legislatura es el de Sumar y el de los partidos que hoy forman la coalición; Podemos, que concurrió con Sumar en 2023, se separó del grupo en diciembre de 2023 y no forma parte de Frente Amplio. A 19 de octubre de 2026 Frente Amplio no ha publicado su programa para el 29-N; el enlace remite al programa de Sumar para las generales de 2023."

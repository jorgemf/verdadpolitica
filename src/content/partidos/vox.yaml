papelLegislatura: "Tercer grupo del Congreso (33 diputados; 32 desde julio de 2026, tras el paso de Ortega Smith al Grupo Mixto), en la oposición. Desde 2026 gobierna en coalición con el PP en Extremadura, Aragón, Castilla y León y Andalucía."
escanos2023: 33
resumen: "Tercer grupo del Congreso (33 escaños en 2023; 32 desde julio de 2026), en la oposición durante toda la legislatura. En julio de 2024 dejó los gobiernos autonómicos que compartía con el PP; desde 2026 gobierna en coalición con el PP en Extremadura, Aragón, Castilla y León y Andalucía, y apoya desde fuera al Gobierno valenciano. Concurre al 29-N con Santiago Abascal como candidato. Para el Senado pactó con el PP el 26 de octubre de 2026: no presenta lista en Las Palmas, Santa Cruz de Tenerife, Cádiz, Valencia, Castellón y Baleares, donde el PP incluye a un independiente propuesto por Vox; en 14 provincias presenta un solo candidato y el PP no concurre en Gipuzkoa, Girona y Tarragona."
web: https://www.voxespana.es
nota: "A 6 de noviembre de 2026 Vox no ha publicado su programa para el 29-N."

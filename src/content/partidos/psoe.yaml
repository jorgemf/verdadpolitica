resumen: "Partido del Gobierno durante la legislatura (121 escaños), en coalición con Sumar, tras la investidura de Pedro Sánchez del 16 de noviembre de 2023, que apoyaron ERC, Junts, EH Bildu, PNV, BNG y Coalición Canaria. Preside los gobiernos de Cataluña (PSC), Asturias, Castilla-La Mancha y Navarra, y forma parte del Gobierno vasco con el PNV. Concurre al 29-N con Sánchez como candidato, proclamado por su Comité Federal el 17 de octubre de 2026; al Senado se presenta en listas conjuntas con los partidos de Frente Amplio (coalición Senado de Progreso) en buena parte de las circunscripciones."
nota: "A 23 de octubre de 2026 el PSOE no había publicado su programa para el 29-N, cuya elaboración coordina Cristina Narbona. Sus propuestas más recientes son las resoluciones de su 41.º Congreso Federal (noviembre de 2024) y los anuncios de precampaña."

resumen: "Concurrió a las generales de 2023 dentro de la lista de Sumar y obtuvo cinco diputados. Sus ministras en funciones, Irene Montero e Ione Belarra, salieron del Gobierno en noviembre de 2023, y en diciembre sus diputados pasaron al Grupo Mixto. Desde enero de 2024, tras la renuncia de Lilith Verstrynge, cuyo escaño pasó a Sumar, tiene cuatro. Votó por separado el resto de la legislatura y negoció medidas puntuales con el Gobierno a cambio de sus votos. Su única presencia en un gobierno autonómico es la de Begoña Alfaro, vicepresidenta tercera de Navarra desde agosto de 2023 por la coalición Contigo-Zurekin; en junio de 2025 la dirección estatal le pidió salir del Ejecutivo, ella se negó (última situación documentada: 22 de octubre de 2026, actuando como vicepresidenta). Concurre al 29-N con Irene Montero de candidata, respaldada en primarias sin otros aspirantes en octubre de 2026, y sin acuerdo estatal con Frente Amplio: solo comparte coalición con partidos de Frente Amplio en la Comunidad Valenciana (Compromís-Front Valencià, donde encabeza la lista por Alicante) y en Canarias (Unidad del Pueblo Canario). En Cataluña no presenta lista propia y aporta candidatos a las listas de ERC."
nota: "Sus cinco escaños de 2023 se obtuvieron dentro de la lista de Sumar y también cuentan en los 31 de Sumar. A 23 de octubre de 2026 Podemos no ha publicado un programa completo para el 29-N: su web de campaña, presentada el 19 de octubre, resume cinco ejes (vivienda, precios, paz, trabajo, y clima y cuidados). En 2023 concurrió con el programa de Sumar. Su último programa propio es el de las elecciones europeas de 2024."

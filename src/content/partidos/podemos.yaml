resumen: "Concurrió a las generales de 2023 dentro de la lista de Sumar y obtuvo cinco diputados. Sus ministras en funciones, Irene Montero e Ione Belarra, salieron del Gobierno en noviembre de 2023, y en diciembre sus diputados pasaron al Grupo Mixto. Desde enero de 2024, tras la renuncia de Lilith Verstrynge, cuyo escaño pasó a Sumar, tiene cuatro. Votó por separado el resto de la legislatura y negoció medidas puntuales con el Gobierno a cambio de sus votos. Su única presencia en un gobierno autonómico es la de Begoña Alfaro, vicepresidenta tercera de Navarra desde agosto de 2023 por la coalición Contigo-Zurekin; en junio de 2025 la dirección estatal le pidió salir del Ejecutivo y ella se negó (última situación documentada: agosto de 2025). Concurre al 29-N con Irene Montero de candidata y fuera de Frente Amplio; en Cataluña no presenta lista propia y va en las listas de ERC."
nota: "Sus cinco escaños de 2023 se obtuvieron dentro de la lista de Sumar y también cuentan en los 31 de Sumar. A 19 de octubre de 2026 Podemos no ha publicado su programa para el 29-N; el enlace remite al programa de Sumar para las generales de 2023, con el que concurrió. Su último programa propio es el de las elecciones europeas de 2024."

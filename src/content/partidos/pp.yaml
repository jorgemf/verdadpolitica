resumen: "Primer partido de la oposición (137 escaños) tras no lograr Feijóo la investidura en septiembre de 2023, con mayoría absoluta en el Senado. Preside 11 comunidades y Ceuta y Melilla; desde 2026, en coalición con Vox en Extremadura, Aragón, Castilla y León y Andalucía. Forma parte del Gobierno de Canarias que preside Coalición Canaria. Concurre al 29-N con Feijóo como candidato."
nota: "A 23 de octubre de 2026 el PP no había publicado su programa para el 29-N; Feijóo anunció el 19 de octubre que lo presentará más adelante. El enlace remite al programa completo de las generales de 2023. Sus propuestas más recientes son los doce compromisos del \"Contrato con España\" (19 de octubre de 2026) y los anuncios de precampaña."

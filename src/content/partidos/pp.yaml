resumen: "Primer partido de la oposición (137 escaños) tras no lograr Feijóo la investidura en septiembre de 2023, con mayoría absoluta en el Senado. Preside 11 comunidades y Ceuta y Melilla; desde 2026, en coalición con Vox en Extremadura, Aragón, Castilla y León y Andalucía. Forma parte del Gobierno de Canarias que preside Coalición Canaria. Concurre al 29-N con Feijóo como candidato. Para el Senado pactó con Vox el 26 de octubre de 2026: el PP no se presenta en Gipuzkoa, Girona y Tarragona, y en Las Palmas, Santa Cruz de Tenerife, Cádiz, Valencia, Castellón y Baleares, donde Vox no presenta lista, incluye a un independiente propuesto por Vox."
nota: "A 6 de noviembre de 2026 el PP no había publicado su programa para el 29-N; el partido anunció que lo presentará el 10 de noviembre en Madrid. Sus propuestas más recientes son los doce compromisos del \"Contrato con España\" (19 de octubre de 2026) y los anuncios de precampaña."

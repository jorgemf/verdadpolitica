resumen: "Primer partido de la oposición (137 escaños) tras no lograr Feijóo la investidura en septiembre de 2023, con mayoría absoluta en el Senado. Gobierna 11 comunidades y Ceuta y Melilla; desde 2026, en coalición con Vox en Extremadura, Aragón, Castilla y León y Andalucía. Concurre al 29-N con Feijóo como candidato."
nota: "A 19 de octubre de 2026 el PP no había publicado su programa para el 29-N; el enlace remite al resumen oficial del programa de las generales de 2023, porque el programa completo no está disponible en pp.es. Sus propuestas más recientes son el \"Contrato con España\" presentado el 19 de octubre de 2026."

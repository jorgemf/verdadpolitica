  # ── Choque ──────────────────────────────────────────────────────────────────
  - tipo: choque
    tema: economia-impuestos
    titulo: "El programa no cuantifica su coste total ni cómo encaja en las reglas fiscales europeas"
    texto: "El programa no incluye una memoria económica con el coste de sus medidas ni su efecto sobre el déficit y la deuda. España cerró 2025 con un déficit del 2,18 % del PIB (2,39 % con las medidas por la DANA) y una deuda del 100,7 %. Con una deuda superior al 90 %, el Reglamento (UE) 2024/1263 exige que la senda de ajuste la reduzca una media mínima de un punto del PIB al año (art. 7) y alcanzar un margen de 1,5 puntos de déficit estructural por debajo del 3 % (art. 8). Entre sus medidas de mayor coste previsible están llevar el gasto sanitario a 2.900 euros por habitante, «en torno al 8% del PIB», frente al 6,4 % de 2024 (medida 302); la jubilación a los 63 y la pensión mínima igual al SMI (116 y 127) y la compra de la mayoría de Repsol (37), que el Gobierno cifró en unos 9.000 millones. Propone nuevos impuestos sin cifrar su recaudación."
    medidas: "Medidas 30, 31, 47, 48 y 62 (pp. 17-23); 37 (p. 18); 116 (p. 41); 127 (p. 44); 302 (p. 89)"
    fuentes:

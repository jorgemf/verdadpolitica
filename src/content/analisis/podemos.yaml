  - tipo: incoherencia
    tema: economia-impuestos
    titulo: "La gratuidad del transporte se paga en parte con impuestos a beneficios extraordinarios que otras medidas eliminan"
    texto: "La medida 40 garantiza «la gratuidad de todo el transporte público de viajeros», incluida la media y larga distancia ferroviaria, y la financia con «la fiscalidad verde, los impuestos a los vuelos privados y la tributación de los beneficios extraordinarios de las grandes empresas energéticas». Pero la medida 39 reforma el mercado eléctrico para «acabar con los beneficios caídos del cielo», y la 37 pasa la mayoría de Repsol al Estado, con lo que esa base fiscal se reduce. Como referencia, el gravamen temporal a las energéticas recaudó 1.164 millones en 2024, según Hacienda, mientras que solo las bonificaciones parciales y el abono único del transporte cuestan al Estado más de 1.371 millones en 2026. Límites: el programa no cifra ni el coste de la gratuidad total ni lo que aportaría cada una de las tres fuentes."
    medidas: "Medidas 37 y 39 (pp. 18-19); medida 40 (p. 19); medida 31 (p. 17)"

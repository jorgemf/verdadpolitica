  # ── Incoherencia ────────────────────────────────────────────────────────────
  - tipo: incoherencia
    tema: energia-medioambiente
    titulo: "El programa promete topar el precio del gas y los carburantes y, a la vez, eliminar las ayudas a los fósiles"
    texto: "La medida 38, «Topes a la electricidad, el gas y los carburantes», fija que las tarifas domésticas de luz y gas no suban más de un 5 % sobre el periodo anterior y recupera «el tope al gas» a 40 €/MWh; en campaña, anuncia que Irene Montero se atreverá a «topar los precios de la gasolina». La medida 317 promete «eliminar progresivamente» las ayudas a la industria fósil y resume: «Ni un euro público para alimentar la crisis climática». Cita la cifra del FMI de 7 billones de dólares en ayudas a los fósiles. El FMI cuenta como subvención explícita cobrar por debajo del coste de suministro y atribuye que esas subvenciones se duplicaran, hasta 1,3 billones, al apoyo público a consumidores y empresas ante la subida de la energía. Límites: si el tope se financia recortando márgenes de las empresas y no por debajo del coste, no sería una subvención en ese sentido."
    medidas: "Medida 38 (pp. 18-19); medida 317 (p. 95)"
    fuentes:

  - tipo: choque
    tema: vivienda
    titulo: "El TJUE vio desproporcionado exigir arraigo en el municipio para comprar vivienda, como plantea el programa en las islas"
    texto: "La medida 3 limita la compra de vivienda a la residencia propia o familiar y añade: «En los territorios insulares, aplicaremos limitaciones específicas a la adquisición de viviendas por personas sin residencia efectiva en ellos, con independencia de su nacionalidad u origen». El art. 63 del Tratado de Funcionamiento de la UE prohíbe restringir los movimientos de capitales, que incluyen comprar inmuebles. En el asunto Libert (C-197/11 y C-203/11, 2013), el Tribunal de Justicia vio que exigir un «vínculo suficiente» con el municipio, como haber residido allí seis años, para comprar vivienda es una restricción que va «más allá de lo necesario». Límites: el Tribunal admitió que proteger a la población local con menos recursos puede justificar restricciones si son proporcionadas; todo dependerá del diseño, que el programa no detalla."

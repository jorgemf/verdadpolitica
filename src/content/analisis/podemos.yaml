  # ── Respaldo ────────────────────────────────────────────────────────────────
  - tipo: respaldo
    tema: sanidad
    titulo: "Los estudios asocian una atención primaria más fuerte a menos mortalidad y a una salud más equitativa"
    texto: "La medida 305 propone una ley que fije que «al menos el 25% del presupuesto sanitario se destine efectivamente a Atención Primaria», con un máximo de 1.300 pacientes por médico de familia y cita «en un máximo de 48 horas hábiles». En 2024 la atención primaria supuso el 13,9 % del gasto sanitario consolidado de las comunidades autónomas (13.230 millones), según la Estadística de Gasto Sanitario Público. La revisión de Starfield, Shi y Macinko (Milbank Quarterly, 2005) concluye que la atención primaria ayuda a prevenir enfermedad y muerte y se asocia a una distribución más equitativa de la salud, tanto entre países como dentro de ellos. Límites: la evidencia es sobre todo observacional y no fija un porcentaje óptimo; pasar del 13,9 % al 25 % a gasto constante supondría unos 10.500 millones más para este nivel, y el programa no cifra ese coste."
    medidas: "Medida 305 (p. 90); medida 302 (p. 89)"
    fuentes:
      - titulo: "Contribution of Primary Care to Health Systems and Health (Starfield, Shi y Macinko)"
        url: https://pmc.ncbi.nlm.nih.gov/articles/PMC2690145/
        medio: "The Milbank Quarterly"
        tipo: academica

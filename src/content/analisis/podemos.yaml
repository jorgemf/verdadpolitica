  - tipo: choque
    tema: empleo-pensiones
    titulo: "Los estudios sobre reducir la jornada en Francia y Portugal no hallan la creación de empleo que el programa espera"
    texto: "La medida 113 propone reducir «la jornada laboral a 30 horas semanales durante la legislatura, comenzando con una bajada a 35 horas», sin bajar salarios, y afirma que «permitirá la creación de nuevos puestos de trabajo». En Francia, la ley de 35 horas de 1998 se aplicó con menos rigor en Alsacia-Mosela y el empleo allí no evolucionó de forma significativamente distinta (Chemin y Wasmer, 2009). En Portugal, la bajada de 44 a 40 horas de 1996 redujo las salidas del empleo de los afectados y subió su salario por hora, sin crear empleo (Raposo y van Ours, 2010). Límites: ninguno evalúa 30 horas ni mide el bienestar; los ensayos voluntarios de semana de cuatro días sin rebaja salarial sí hallan menos agotamiento y más satisfacción (Fan, Schor y otros, 2025)."
    medidas: "Medida 113 (p. 41)"
    fuentes:
      - titulo: "Using Alsace-Moselle Local Laws to Build a Difference-in-Differences Estimation Strategy of the Employment Effects of the 35-Hour Workweek Regulation in France (Chemin y Wasmer)"
        url: https://econpapers.repec.org/RePEc:ucp:jlabec:v:27:y:2009:i:4:p:487-524
        medio: "Journal of Labor Economics"
        tipo: academica

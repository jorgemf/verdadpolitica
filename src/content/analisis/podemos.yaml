  - tipo: respaldo
    tema: sanidad
    titulo: "En España deja de ir al dentista por el coste una parte de la población mayor que en la UE; la OMS pide más cobertura"
    texto: "La medida 307 promete aumentar «hasta el 100% la cobertura de la cartera de servicios de salud bucodental, oftalmológica y auditiva», con un dentista público que «incluirá empastes, limpiezas, ortodoncias, endodoncias, prótesis y férulas». Según Eurostat, en 2025 el 4,0 % de los mayores de 16 años en España dejó de ir al dentista por ser demasiado caro, frente al 2,8 % de la UE; en el 20 % con menos ingresos fue el 8,6 %, y en el 20 % con más ingresos, el 0,9 %. La Oficina Europea de la OMS (2021) señaló que la cobertura limitada del dentista y la óptica en el Sistema Nacional de Salud causa dificultades económicas a parte de la población y recomendó ampliarla. Límites: estos datos indican dónde está el problema, no el efecto de esta reforma concreta; el programa no cifra su coste ni cuántos profesionales públicos necesitaría."
    medidas: "Medida 307 (p. 91); medida 305 (p. 90)"
    fuentes:

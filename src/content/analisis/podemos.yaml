  - tipo: respaldo
    tema: educacion
    titulo: "La educación infantil pública y de calidad beneficia sobre todo a los niños desfavorecidos; la evidencia global es mixta"
    texto: "La medida 281 promete construir «en un plazo máximo de cuatro años todas las plazas públicas necesarias para garantizar una cobertura universal, gratuita y de gestión pública directa» en educación infantil de 0 a 3 años, y la 280 baja sus ratios. Un metaanálisis de 250 estimaciones de 30 estudios con experimentos naturales (van Huizen y Plantenga, 2018) describe una evidencia global mixta, con mejores resultados en programas de más calidad y públicos y ganancias concentradas en niños de familias desfavorecidas. En España, la extensión de plazas públicas para niños de 3 años a principios de los noventa mejoró la lectura a los 15 años en unas 0,15 desviaciones típicas, sobre todo en niñas y alumnos desfavorecidos (Felfe, Nollenberger y Rodríguez-Planas, 2015). Límites: el estudio español trata de los 3 años, no del primer ciclo, y el programa no cifra el coste."
    medidas: "Medidas 280 y 281 (p. 80)"
    fuentes:
      - titulo: "Do children benefit from universal early childhood education and care? A meta-analysis of evidence from natural experiments (van Huizen y Plantenga)"
        url: https://econpapers.repec.org/RePEc:eee:ecoedu:v:66:y:2018:i:c:p:206-222
        medio: "Economics of Education Review"
        tipo: academica
      - titulo: "Can't buy mommy's love? Universal childcare and children's long-term cognitive development (Felfe, Nollenberger y Rodríguez-Planas)"

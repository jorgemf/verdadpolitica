  - tipo: incoherencia
    tema: energia-medioambiente
    titulo: "El programa compra la mayoría de Repsol y a la vez veta contratos y ayudas públicas a las grandes empresas contaminantes"
    texto: "La medida 37 prevé que el Estado compre «la mayoría absoluta del accionariado de Repsol» para que la Empresa Pública de Energía cuente con su «infraestructura industrial, logística y comercial» en «el conjunto del sector energético». La medida 41 grava a las grandes empresas más contaminantes y dice que «prohibiremos que estas empresas reciban subvenciones públicas o puedan contratar con las administraciones mientras mantengan estas actividades contaminantes»; la 317 promete «ni un euro público para alimentar la crisis climática». La proposición de ley de Podemos de 2025 para nacionalizarla la describe como «la empresa líder en emisiones invernadero», con unos 10,8 millones de toneladas de CO₂ equivalente, el 4 % de las emisiones directas de España. Límites: aquella ley preveía recortar un 75 % la producción y el refino antes de 2030; el programa no dice si la Repsol pública lo haría."
    medidas: "Medida 37 (p. 18); medida 41 (pp. 19-20); medida 317 (p. 95)"
    fuentes:
      - titulo: "Proposición de Ley de nacionalización de Repsol y de su reconversión en una empresa pública al servicio de una transición energética verde y justa (122/000236)"

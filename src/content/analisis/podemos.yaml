  - tipo: respaldo
    tema: educacion
    titulo: "Las clases de 13 a 17 alumnos mejoraron los resultados en el experimento STAR, aunque otros estudios no hallan efecto"
    texto: "La medida 280 fija «nuevas ratios máximas en 15 alumnos y alumnas en Primaria, 20 en Secundaria y 23 en Bachillerato». En el experimento STAR de Tennessee, que asignó al azar a alumnos de los primeros cursos a clases de 13 a 17 o de 22 a 25, los de clases pequeñas mejoraron unos 4 percentiles en las pruebas el primer año (Krueger, NBER, 1997). La evidencia está dividida: con la variación natural del tamaño de las clases en Connecticut, Hoxby (NBER, 1998) no encontró efecto de reducirlas desde una base de entre 15 y 30 alumnos. Límites: STAR evaluó los primeros cursos de primaria, no secundaria ni bachillerato, y bajar las ratios exige contratar más docentes, un coste que el programa no cuantifica."
    medidas: "Medida 280 (p. 80)"

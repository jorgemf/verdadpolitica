  - tipo: respaldo
    tema: vivienda
    titulo: "El Banco de España cifra el alquiler social en el 1,5 % de las viviendas y pide centrar la política en ampliarlo"
    texto: "Las medidas 9, 16, 17 y 18 amplían el parque público de alquiler social (viviendas y suelo de la Sareb, derecho de tanteo y retracto, reserva del 50 % de la vivienda nueva de los planes urbanísticos) y evitan que se pierda: «Toda vivienda que tenga algún tipo de protección pública conservará permanentemente esta condición». El Banco de España (Informe Anual 2023) estima el alquiler social en unas 300.000 viviendas, el 1,5 % de las principales; sitúa los problemas de acceso en los hogares de menor renta, jóvenes e inmigrantes, y recomienda «un foco especial en el estímulo de la oferta de vivienda, especialmente en el caso del mercado del alquiler y el alquiler social». Límites: el Banco no evalúa la protección permanente ni la compra pública de viviendas ya alquiladas, pide un horizonte largo y colaboración privada, y el programa no cifra el coste de ampliar el parque."
    medidas: "Medidas 9 y 16 (p. 10); medidas 17 y 18 (p. 11)"
    fuentes:

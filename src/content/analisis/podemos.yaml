  - tipo: choque
    tema: vivienda
    titulo: "Los topes al alquiler estudiados en Cataluña, Berlín y San Francisco bajaron los precios y, en varios casos, la oferta"
    texto: "La medida 1 propone una «reducción extraordinaria del 40 % de los precios del alquiler», en contratos vigentes y nuevos. En Cataluña, el tope de 2020-2022 bajó los alquileres un 4-6 % sin reducir la oferta según un estudio (Jofre-Monseny y otros, 2023) y, según otro, bajó los caros, subió los baratos y redujo la oferta (Monràs y García-Montalvo, 2023). Con el tope de la Ley de Vivienda, aplicado allí desde marzo de 2024, los anuncios cayeron un 20,5 % hasta finales de 2025 (7 % en el resto de España) y la renta subió un 5,7 % (10,8 % nacional), según un análisis descriptivo de Fedea (2026). En Berlín, la congelación de 2020 bajó las rentas anunciadas y redujo los anuncios (Hahn y otros, 2024); en San Francisco, los caseros afectados redujeron un 15 % su oferta (Diamond y otros, 2019). Ningún estudio evalúa rebajas de esa magnitud."

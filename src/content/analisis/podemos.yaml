    tema: empleo-pensiones
    titulo: "Jubilarse a los 63 y una pensión mínima igual al SMI elevan un gasto que la AIReF estima en el 14,6 % del PIB hasta 2050"
    texto: "La medida 116 propone «adelantar la edad ordinaria de jubilación a los 63 años», y la 127, que «la pensión mínima contributiva se equipare al SMI», que la 111 quiere subir a 1.800 euros; el programa no cifra el coste. La AIReF (mayo de 2026) estima un gasto bruto en pensiones del 14,6 % del PIB de media en 2022-2050 y un gasto neto de los nuevos ingresos del 13 %, por debajo del umbral legal del 13,3 %, pero avisa de que ese cumplimiento no garantiza la sostenibilidad y de que, a políticas constantes, la deuda llegaría al 123 % del PIB en 2050. Las pensiones mínimas de jubilación de 2026 van de 11.590 a 17.592,40 euros al año, frente a 17.094 del SMI; con 1.800 euros serían 25.200. La OCDE prevé una edad normal de jubilación media de 66,4 años."
    medidas: "Medidas 111 y 116 (p. 41); medida 127 (p. 44)"

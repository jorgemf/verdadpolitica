  - tipo: respaldo
    tema: energia-medioambiente
    titulo: "El Gobierno reconoció en 2026 que el tope a la inversión en redes eléctricas era insuficiente para atender la demanda"
    texto: "La medida 8 propone eliminar «el tope a la inversión en redes para que España tenga la red eléctrica que necesita para crecer, contratar y construir vivienda». El Ministerio para la Transición Ecológica reconoció en julio de 2026 que los límites vigentes desde 2013 (0,13 % del PIB en distribución y 0,065 % en transporte) «se han mostrado insuficientes» ante «el gran volumen de peticiones de acceso para nuevas demandas», y el Real Decreto 640/2026 autorizó 17.900 millones adicionales hasta 2030. Límites: el propio decreto recuerda que estas inversiones se pagan con los peajes de la factura de todos los consumidores y que las empresas no siempre agotaron los límites existentes, de modo que suprimir el tope no garantiza por sí solo más inversión y tiene un coste para el consumidor."
    medidas: "Medida 8"

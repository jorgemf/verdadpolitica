  - tipo: choque
    tema: sanidad
    titulo: "La restricción sanitaria de 2012 a inmigrantes sin papeles elevó su mortalidad, según un estudio publicado"
    texto: "La medida 20 propone «garantizar la sostenibilidad del sistema sanitario» excluyendo «a los extranjeros en situación ilegal salvo casos de urgencia grave». España aplicó una restricción parecida con el Real Decreto-ley 16/2012, que mantenía la asistencia de urgencia por enfermedad grave o accidente, el embarazo y a los menores. Un estudio publicado en European Economic Review (Juanmarti, López Casasnovas y Vall Castelló, 2021) estima que, en sus tres primeros años, la restricción elevó la mortalidad de los inmigrantes en situación irregular en 0,31 muertes mensuales por cada 100.000, unas 82 muertes adicionales al año, y que la emigración selectiva solo explica el 3,45 % de ese efecto. Límites: es un estudio de un país y un periodo concretos, y el programa no cuantifica el ahorro que espera de la medida."
    medidas: "Medida 20"

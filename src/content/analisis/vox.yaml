  - tipo: choque
    tema: inmigracion
    titulo: "Deportar por delitos o por costumbres choca, para ciudadanos de la UE, con la Directiva 2004/38"
    texto: "La medida 14 propone la «deportación de quienes cometan delitos graves o hagan del delito leve su forma de vida, así como de quienes traten de imponer costumbres, hábitos o culturas ajenas a nuestro modo de vida». Para los ciudadanos de otros países de la UE y sus familiares, el art. 27.2 de la Directiva 2004/38 exige que la expulsión se base «exclusivamente en la conducta personal del interesado», que esta sea «una amenaza real, actual y suficientemente grave», y dispone que «la existencia de condenas penales anteriores no constituirá por sí sola una razón» para expulsar. El art. 28 obliga además a valorar la duración de la residencia, la edad, la familia y la integración. Límites: la directiva no ampara a los nacionales de fuera de la UE, y la expulsión de un europeo cabe si se decide caso por caso; el programa no lo distingue."
    medidas: "Medida 14"

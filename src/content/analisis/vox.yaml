  - tipo: respaldo
    tema: vivienda
    titulo: "Con el tope de la Ley de Vivienda cayó la oferta de alquiler en Cataluña y las rentas subieron menos, según Fedea"
    texto: "La medida 30 propone la «derogación de la Ley de Vivienda» para recuperar «una oferta de alquileres estable, abundante y asequible». La evidencia está dividida. En Cataluña, el tope de 2020-2022 bajó los alquileres un 4-6 % sin reducir la oferta según un estudio (Jofre-Monseny y otros, 2023) y, según otro, bajó los caros, subió los baratos y redujo la oferta (Monràs y García-Montalvo, 2023). Con el tope de la Ley de Vivienda, aplicado allí desde marzo de 2024, los anuncios cayeron un 20,5 % hasta finales de 2025 (7 % en el resto de España) y la renta subió un 5,7 % (10,8 % nacional), según un análisis descriptivo de Fedea (2026). En Berlín, la congelación de 2020 bajó las rentas anunciadas y redujo los anuncios (Hahn y otros, 2024); en San Francisco, los caseros afectados redujeron un 15 % su oferta (Diamond y otros, 2019)."
    medidas: "Medida 30"

  - tipo: incoherencia
    tema: economia-impuestos
    titulo: "El programa promete reducir la deuda y Abascal plantea en campaña acudir a deuda para la transición fiscal"
    texto: "La medida 3 se titula «Reducción de la deuda pública» y propone «compatibilizar la rebaja de impuestos con la financiación de los servicios públicos esenciales, mediante el control del déficit». En una entrevista en Onda Cero el 4 de noviembre de 2026, preguntado por cómo sostener el gasto bajando impuestos, Santiago Abascal respondió que «el sistema exacto es discutible, accesorio» y apuntó a «acudir a deuda pública temporalmente» como mecanismo de transición. La deuda pública cerró 2025 en el 100,7 % del PIB (Banco de España), y con deuda superior al 90 % las reglas fiscales europeas exigen reducirla al menos un punto del PIB al año de media. Financiar la transición con deuda supone más endeudamiento en esos años, en sentido contrario al compromiso de la medida 3."
    medidas: "Medidas 2 y 3"

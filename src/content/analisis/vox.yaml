  # ── Choque ──────────────────────────────────────────────────────────────────
  - tipo: choque
    tema: economia-impuestos
    titulo: "El programa no cuantifica su coste total ni cómo encaja en las reglas fiscales europeas"
    texto: "El programa no incluye una memoria económica con el coste de sus medidas ni su efecto sobre el déficit y la deuda. España cerró 2025 con un déficit del 2,18 % del PIB (2,39 % con las medidas por la DANA) y una deuda del 100,7 %. Con una deuda superior al 90 %, el Reglamento (UE) 2024/1263 exige que la senda de ajuste la reduzca una media mínima de un punto del PIB al año (art. 7) y alcanzar un margen de 1,5 puntos de déficit estructural por debajo del 3 % (art. 8). Entre sus medidas de mayor coste previsible están la «rebaja masiva» del IRPF, el IVA y Sociedades (medida 2), el IVA del 0 % y el ITP bonificado en la primera vivienda (34) y las cotizaciones pagadas por el Estado por cuidado de hijos (94). Propone compensarlo con recortes de «gastos superfluos» (43), sin cifrarlos."
    medidas: "Medidas 2, 3, 34, 43 y 94"

  - tipo: respaldo
    tema: empleo-pensiones
    titulo: "Las plazas públicas de educación infantil aumentaron el empleo de las madres en España, aunque no en todos los países"
    texto: "La medida 94 incluye «la gratuidad real de la educación infantil de 0 a 3 años». En España, la extensión de plazas públicas a tiempo completo para niños de 3 años aumentó el empleo materno: dos madres más empleadas por cada diez niños escolarizados, sobre todo madres de 30 años o más y con dos o más hijos (Nollenberger y Rodríguez-Planas, Labour Economics, 2015). La evidencia no es uniforme: en Noruega, la expansión de plazas subvencionadas apenas cambió el empleo de las madres porque sustituyó sobre todo cuidados informales (Havnes y Mogstad, Journal of Public Economics, 2011). El efecto depende de cuántas familias usarían la plaza y de qué cuidado sustituya. El estudio español trata de niños de 3 años, no de 0 a 2, y el programa no indica cuántas plazas crearía ni su coste."
    medidas: "Medida 94"
    fuentes:

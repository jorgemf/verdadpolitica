  - tipo: choque
    tema: vivienda
    titulo: "Las ayudas a la compra tienden a subir precios donde la oferta es rígida, según el Banco de España y el caso británico"
    texto: "La medida 34 promete un IVA del 0 % en la compra de la primera vivienda nueva, bonificar al 100 % el ITP en la usada y recuperar la deducción por vivienda habitual, y la 29 añade avales y créditos blandos. El Banco de España (Informe Anual 2023) advierte de que, con una oferta rígida, las políticas de apoyo a la compra «suelen generar un aumento de los precios de compraventa». El programa británico Help to Buy, un préstamo público del 20 % del precio (40 % en Londres), subió los precios en Londres sin aumentar la construcción; cerca de la frontera con Gales, con oferta más flexible, aumentó la construcción sin efecto apreciable en los precios (Carozzi, Hilber y Yu, 2024). Además, la Directiva del IVA (art. 98, reformado en 2022) solo admite tipos inferiores al 5 % o exenciones con deducción en una lista tasada de casos; hoy la vivienda nueva tributa al 10 %."
    medidas: "Medidas 29 y 34"

  - tipo: choque
    tema: inmigracion
    titulo: "La «prioridad nacional» en vivienda y ayudas choca con la igualdad de trato que exige el derecho de la UE"
    texto: "Las medidas 18 y 27 piden «acceso preferente de los españoles» a vivienda pública, guarderías, ayudas y servicios sociales, y la 22, que el IMV atienda «únicamente» a españoles. La Constitución remite los derechos de los extranjeros a «los tratados y la ley» (art. 13.1). La Directiva 2003/109/CE (art. 11) obliga a tratar como a los nacionales a los residentes de larga duración en seguridad social, asistencia social y «procedimientos para acceder a la vivienda», y solo deja limitar la asistencia a «prestaciones básicas»; el Reglamento 492/2011 (art. 9) da a los trabajadores de la UE igual derecho a las listas de vivienda y sus «prioridades». El IMV es una prestación de la Seguridad Social. La Comisión Europea avisó en 2026 de que puede ser discriminatoria. Una ley puede cambiar la de extranjería, no el derecho de la UE. Esas normas no amparan a quien está en situación irregular (19)."
    medidas: "Medidas 18, 19, 22, 27 y 74"

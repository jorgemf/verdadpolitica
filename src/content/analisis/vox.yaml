  # ── Respaldo ────────────────────────────────────────────────────────────────
  - tipo: respaldo
    tema: vivienda
    titulo: "El Banco de España vincula la subida de precios a la falta de suelo edificable y a la lentitud de la tramitación"
    texto: "La medida 28 plantea reformar la Ley del Suelo para aumentar la construcción con «ampliación de suelo disponible, agilización de procedimientos, supresión de trabas regulatorias innecesarias, simplificación administrativa». El Banco de España (Informe Anual 2023) estima un déficit de unas 375.000 viviendas entre la creación neta de hogares y la vivienda nueva en 2022-2023, constata que los precios de compra y alquiler subieron más en los municipios con menos suelo edificable y señala que la celeridad y la certidumbre de la tramitación urbanística condicionan la oferta. Límites: el mismo informe cita como otro freno la escasez de mano de obra (el 55 % de las constructoras la señalaba a finales de 2023), y el planeamiento depende sobre todo de comunidades y ayuntamientos."
    medidas: "Medida 28"
    fuentes:
      - titulo: "Es sentido común. Programa electoral, 29 de noviembre de 2026"
        url: https://www.voxespana.es/wp-content/uploads/2026/11/Programa-completo-A5-1.pdf

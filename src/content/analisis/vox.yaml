  - tipo: incoherencia
    tema: economia-impuestos
    titulo: "Pide reducir «al mínimo» la Administración y reforzar a la vez plantillas de sanidad, seguridad, defensa y prisiones"
    texto: "La medida 43 propone «reducir al mínimo estrictamente necesario el tamaño de la Administración Pública» para «compensar la bajada masiva de impuestos». A la vez, el programa pide «refuerzo de plantillas médicas, de enfermería y personal administrativo» (63), dotar de «suficientes medios humanos» a Fuerzas Armadas, Guardia Civil, Policía, CNI, Vigilancia Aduanera e Instituciones Penitenciarias (83), «plantillas adecuadamente dimensionadas» en prisiones (85) y el derecho a ser atendido «presencialmente en cualquier oficina pública de forma inmediata» (39). Según la estadística de personal de enero de 2026, de 3.071.725 empleados públicos, 284.853 son militares, policías nacionales y guardias civiles, y el 62,8 % trabaja para las comunidades, donde las instituciones sanitarias son el área que más creció desde 2017 (48 %). El programa no indica en qué áreas se reduciría el personal."
    medidas: "Medidas 39, 43, 63, 83 y 85"

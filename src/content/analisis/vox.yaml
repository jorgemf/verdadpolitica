  - tipo: respaldo
    tema: economia-impuestos
    titulo: "Un estudio del Banco de España asocia una regulación más compleja con menos empresas"
    texto: "El programa propone suprimir lo que no sea «estrictamente necesario» (medida 36), «derogar tres normas por cada una que se apruebe» (40) y que una misma actividad no tenga requisitos distintos en cada territorio (42). Un documento de trabajo del Banco de España (Mora-Sanguinetti y Pérez-Valls, 2020) calcula que la producción normativa se multiplicó por cuatro desde finales de los años setenta, hasta 11.737 normas en 2018, y encuentra que una regulación más compleja se asocia a menos empresas y a menos sociedades limitadas, las de mayor tamaño. Límites: es una asociación y no mide el efecto de una regla concreta como la del «tres por uno»; el silencio positivo como regla general (41) ya figura en la Ley 39/2015 (art. 24), con excepciones como las actividades que puedan dañar el medio ambiente, y la técnica de la medida 42 la anuló el Tribunal Constitucional en 2017."
    medidas: "Medidas 36, 40, 41 y 42"
    fuentes:

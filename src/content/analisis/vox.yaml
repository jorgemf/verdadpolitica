  - tipo: incoherencia
    tema: sanidad
    titulo: "Promete reforzar la sanidad, que gestionan las comunidades, y en campaña propone recortar sobre todo sus transferencias"
    texto: "El programa se compromete a «compatibilizar la rebaja de impuestos con la financiación de los servicios públicos esenciales» (medida 3) y a reforzar la atención primaria, reducir las listas de espera y mejorar plantillas y retribuciones sanitarias (61 a 63). El 4 de noviembre de 2026, el secretario general de Vox en el Congreso, José María Figaredo, cifró en 180.000 millones anuales el gasto en «cuestiones que no son esenciales», sobre todo transferencias a las comunidades autónomas, y propuso reducirlo primero a 120.000 millones y después a 80.000. Las comunidades gestionan el 93,6 % del gasto sanitario público, que fue de 101.739 millones en 2024 (Ministerio de Sanidad). Ni el programa ni Figaredo detallan qué transferencias se recortarían ni cómo se mantendría la sanidad que financian."
    medidas: "Medidas 3, 43 y 61 a 63"

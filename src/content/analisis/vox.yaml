  - tipo: choque
    tema: modelo-territorial
    titulo: "La regla de que lo legal en una comunidad lo sea en toda España ya la anuló el Tribunal Constitucional en 2017"
    texto: "La medida 42 propone que «lo que es legal en una región de España, lo es en toda España» y que cualquier empresa, profesional o producto que opere legalmente en una comunidad pueda hacerlo en el resto «sin trámites, licencias ni registros adicionales». Es el «principio de eficacia nacional» que introdujo la Ley 20/2013 de garantía de la unidad de mercado y que el Tribunal Constitucional anuló en la STC 79/2017 (arts. 19 y 20): consideró que excede la competencia estatal del art. 149.1.13 CE y vulnera la territorialidad de las competencias autonómicas, porque permitiría aplicar en un mismo territorio «hasta diecisiete normativas distintas», y que no es una cuestión disponible para el legislador estatal. Alcance: el Estado sí puede armonizar con normas básicas o suprimir trabas injustificadas; lo que el Tribunal rechazó es reconocer en todo el país la norma del lugar de origen."

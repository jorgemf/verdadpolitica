  - tipo: respaldo
    tema: economia-impuestos
    titulo: "Poder amortizar la inversión el mismo año aumentó la inversión de las empresas en EE. UU., sobre todo en las pequeñas"
    texto: "La medida 181 propone ampliar la libertad de amortización: lo que una empresa invierta en «maquinaria, equipos, digitalización, inteligencia artificial, ciberseguridad, software o patentes podrá descontarse entero el mismo año». Zwick y Mahon (American Economic Review, 2017), con datos de más de 120.000 empresas estadounidenses, estiman que la amortización acelerada elevó la inversión en bienes que podían acogerse frente a los que no un 10,4 % en 2001-2004 y un 16,9 % en 2008-2010, con una respuesta mucho mayor en las empresas pequeñas y cuando el incentivo daba liquidez inmediata. Límites: el estudio analiza incentivos temporales en Estados Unidos, que adelantan la inversión más que uno permanente; el programa no dice si la medida sería temporal ni cuánto costaría en recaudación diferida."
    medidas: "medida 181"

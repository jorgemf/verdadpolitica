  - tipo: choque
    tema: inmigracion
    titulo: "Hacer de la expulsión la regla tras ciertas condenas choca, para ciudadanos de la UE, con la Directiva 2004/38"
    texto: "La medida 44 establece que «la expulsión será la regla para los extranjeros condenados por delitos sexuales, delitos de sangre y multirreincidencia». Para los ciudadanos de otros países de la UE y sus familiares, el art. 27.2 de la Directiva 2004/38 exige que la expulsión se base «exclusivamente en la conducta personal del interesado», que esta sea «una amenaza real, actual y suficientemente grave», y dispone que «la existencia de condenas penales anteriores no constituirá por sí sola una razón» para expulsar. El art. 28 obliga además a valorar la duración de la residencia, la edad, la familia y la integración, y solo admite expulsar a quien tiene residencia permanente por «motivos graves». Límites: la directiva no ampara a los nacionales de fuera de la UE, y una regla general cabe si cada expulsión de un europeo se decide caso por caso; el programa no lo distingue."

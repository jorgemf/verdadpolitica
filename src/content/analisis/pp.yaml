  - tipo: respaldo
    tema: economia-impuestos
    titulo: "Sin deflactar, la inflación explica la mitad del aumento del IRPF sobre el PIB en 2019-2023, según el Banco de España"
    texto: "La medida 178 promete deflactar la tarifa y actualizar «los principales parámetros del impuesto para impedir que la inflación vuelva a utilizarse como una subida encubierta de impuestos», y la 177, elevar los mínimos personales y familiares. Un documento ocasional del Banco de España (2024), con microdatos de declarantes, estima que cada 1 % de subida de las rentas sin actualizar el impuesto eleva la recaudación un 1,85 %, y que en torno a la mitad del aumento de la ratio IRPF/PIB entre 2019 y 2023 se debe a esa «progresividad en frío», que pesa más en las rentas medias y medias-altas. Actualizar la tarifa evita ese efecto. Límites: el mismo estudio señala que la progresividad en frío redujo la desigualdad de la renta neta, y deflactar supone renunciar a esos ingresos, que el programa no cuantifica."
    medidas: "medidas 177 y 178"
    fuentes:

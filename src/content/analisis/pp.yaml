  - tipo: choque
    tema: vivienda
    titulo: "Las ayudas a la compra tienden a subir precios donde la oferta es rígida, según el Banco de España y el caso británico"
    texto: "Para los menores de 40 años, el programa propone bajar el IVA de la primera vivienda del 10 % al 4 % (medida 153), un aval público que «cubre hasta el 20% del valor de la vivienda» (154) y una «Hucha Hogar Joven» con deducción del 20 % (155). El Banco de España (Informe Anual 2023) advierte de que, con una oferta rígida, las políticas de apoyo a la compra «suelen generar un aumento de los precios de compraventa». El programa británico Help to Buy, un préstamo público del 20 % del precio (40 % en Londres), subió los precios en Londres sin aumentar la construcción; cerca de la frontera con Gales, con oferta más flexible, aumentó la construcción sin efecto apreciable en los precios (Carozzi, Hilber y Yu, 2024). Además, la Directiva del IVA (art. 98, reformado en 2022) solo admite tipos inferiores al 5 % en una lista tasada de casos; hoy la vivienda nueva tributa al 10 %."
    medidas: "medidas 153, 154 y 155"

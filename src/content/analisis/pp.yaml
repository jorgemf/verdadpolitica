  # ── Choque ──────────────────────────────────────────────────────────────────
  - tipo: choque
    tema: economia-impuestos
    titulo: "El programa no cuantifica su coste total ni cómo encaja en las reglas fiscales europeas"
    texto: "El programa no incluye una memoria económica con el coste de sus medidas ni su efecto sobre el déficit y la deuda. España cerró 2025 con un déficit del 2,18 % del PIB (2,39 % con las medidas por la DANA) y una deuda del 100,7 %. Con una deuda superior al 90 %, el Reglamento (UE) 2024/1263 exige que la senda de ajuste la reduzca una media mínima de un punto del PIB al año (art. 7) y alcanzar un margen de 1,5 puntos de déficit estructural por debajo del 3 % (art. 8). Entre sus medidas de mayor coste previsible están la deflactación y rebaja del IRPF (medidas 177 a 179), el IVA del 0 % en alimentos (180), el IVA del 4 % en la primera vivienda (153), la deducción familiar reembolsable (158), la escuela gratuita de 0 a 3 años (163) y un fondo de nivelación autonómico (100). La medida 2 promete decir «cómo se pagará», y ocho medidas numeradas figuran sin contenido."
    medidas: "medidas 2, 100, 153, 158, 163 y 177 a 180"
    fuentes:

  # ── Respaldo ────────────────────────────────────────────────────────────────
  - tipo: respaldo
    tema: vivienda
    titulo: "El Banco de España sitúa la falta de suelo y la lentitud urbanística entre los frenos a la construcción de vivienda"
    texto: "El programa quiere movilizar suelo, aprobar una nueva Ley del Suelo para «agilizar el planeamiento urbanístico», resolver las licencias «en tres meses, con silencio positivo» (medida 144), unificar trámites de los grandes desarrollos (146) y facilitar más edificabilidad y altura (149). El Banco de España (Informe Anual 2025) atribuye la escasa respuesta de la oferta a «la escasez de suelo edificable, la lentitud en la ejecución y las limitaciones de gestión de la planificación urbanística»: en Sevilla, Madrid o Málaga se ha ejecutado entre el 28 % y el 35 % de las viviendas previstas, y señala la densificación como alternativa. Límites: el urbanismo es competencia autonómica y municipal, y la ley estatal del suelo hoy exige acto expreso con silencio negativo para las obras de nueva planta (art. 11.4 del texto refundido de 2015), que habría que reformar."
    medidas: "medidas 144, 146 y 149"

  - tipo: choque
    tema: vivienda
    titulo: "Un millón de viviendas en una legislatura exige terminar unas 250.000 al año, casi el triple de las acabadas en 2025"
    texto: "La medida 144 dice «Construiremos un millón de viviendas», y el programa se presenta como «compromisos concretos a cumplir en una legislatura». Feijóo lo concretó a Politico (16 de noviembre) en leyes para que «se pueda volver a construir una cifra de 250.000 viviendas al año». Según el Banco de España, en 2025 se terminaron unas 92.000 viviendas, frente a una creación neta de 240.000 hogares; el 63 % de las empresas de construcción y promoción que encuesta señala la falta de personal como límite, y la oferta responde poco a los precios. El Ministerio de Vivienda contabilizó en 2024 100.980 viviendas terminadas y 136.187 iniciadas. Límites: el programa incluye medidas para ampliar esa capacidad (suelo, licencias, vivienda industrializada y formación y contratación de trabajadores, medidas 144 a 152), y el millón no distingue entre vivienda pública y privada."
    medidas: "medidas 144 a 152"

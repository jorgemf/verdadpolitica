  - tipo: incoherencia
    tema: vivienda
    titulo: "Feijóo promete un ITP un 60 % más bajo para la primera vivienda; el programa no da cifra y lo deja a un pacto autonómico"
    texto: "La medida 153 rebaja el IVA de la primera vivienda «del 10% al 4% para menores de 40 años» y, sobre el impuesto de transmisiones patrimoniales (ITP) de la vivienda usada, solo dice: «Acordaremos con las Comunidades Autónomas un Impuesto de Transmisiones Patrimoniales reducido». En campaña, el PP anunció en Sevilla (21 de octubre) «rebajas del 60% del IVA y del ITP para menores de 40 años», y Feijóo dijo a Politico (16 de noviembre): «los menores de 35 años, 60% menos de impuesto de transmisiones patrimoniales y de IVA para comprar su primera vivienda». El 60 % del ITP no figura en el programa, y la edad de la entrevista no coincide con la del programa. El tipo del ITP lo regulan las comunidades autónomas (art. 49 de la Ley 22/2009), por lo que el Gobierno central no puede fijar esa rebaja por sí solo, como reconoce el programa al remitirla a un acuerdo."

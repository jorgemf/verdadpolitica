  - tipo: respaldo
    tema: energia-medioambiente
    titulo: "Alargar la vida de las nucleares abarata la luz a corto plazo; a largo plazo depende de la inversión renovable"
    texto: "La medida 228 promete eliminar el calendario de cierre de las centrales nucleares y tramitar «en los primeros cien días» la extensión de su vida útil «con el visto bueno del Consejo de Seguridad Nuclear». La Agencia Internacional de la Energía (2019) concluye que alargar la vida de un reactor es considerablemente más barato que construir una central nueva y competitivo con la solar y la eólica nuevas. Una simulación del mercado ibérico (Fabra, 2026) estima que prorrogar Almaraz bajaría a corto plazo los precios mayoristas y las emisiones al desplazar gas, pero reduciría los incentivos a invertir en renovables y almacenamiento; si esa inversión cae lo bastante, acabaría elevando precios y emisiones. En Alemania, el cierre nuclear se cubrió sobre todo con carbón e importaciones, con un coste social de 3.000 a 8.000 millones de euros al año (Jarvis, Deschenes y Jha, 2022)."
    medidas: "medida 228"

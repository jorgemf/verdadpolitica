  - tipo: incoherencia
    tema: economia-impuestos
    titulo: "El programa promete reducir el déficit estructural y la deuda a la vez que rebaja impuestos y añade gasto"
    texto: "La medida 107 dice: «Reduciremos el déficit estructural y la deuda», y la 4, que la deuda bajará «conforme a las reglas europeas» y que «ningún gasto nuevo se aprobará sin garantizar cómo se financiará». A la vez, el programa reduce ingresos: deflactar el IRPF y elevar sus mínimos (177 y 178), eximir del IRPF a los jóvenes el primer año (179), IVA del 0 % en alimentos (180) y eliminar «de inmediato» el impuesto del 7 % a la producción eléctrica (229). Y añade gasto: un fondo de nivelación autonómico «financiado con recursos del Estado» (100), la mitad de la escuela gratuita de 0 a 3 años (163) y más efectivos y sueldos militares (53). Según el Banco de España, la falta de deflactación explica la mitad de la subida del IRPF sobre el PIB en 2019-2023. Para financiarlo, el programa remite a la auditoría del gasto y a la lucha contra el fraude (medidas 1, 5 y 183), sin cifras."
    medidas: "medidas 1, 4, 5, 53, 100, 107, 163, 177 a 180, 183 y 229"

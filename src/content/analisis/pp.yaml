  - tipo: incoherencia
    tema: exterior-defensa
    titulo: "El programa promete cumplir los compromisos de defensa; Feijóo no fija el gasto y cita entre el 3,1 % y el 3,8 %"
    texto: "La medida 52 promete una inversión plurianual en defensa que permita «conocer fehacientemente y cumplir nuestros compromisos internacionales», y añade que «España volverá a ser un socio fiable». La Declaración de La Haya de la OTAN (25 de junio de 2025) fija para los aliados un gasto de al menos el 3,5 % del PIB en defensa básica en 2035. Preguntado por Politico (16 de noviembre), Feijóo respondió: «No puedo decir qué porcentaje se va a destinar a la defensa porque no sé cómo voy a encontrarme las cuentas públicas españolas. No sé si vamos a llegar al 3,5%, 3,1% o 3,8%». Una de las cifras que cita queda por debajo de ese objetivo. Según la OTAN, España gastó en 2025 el 2,00 % del PIB (33.123 millones), así que cada punto adicional equivale a unos 16.500 millones al año, que el programa no cuantifica. Límite: el plazo de 2035 va más allá de la legislatura."
    medidas: "medidas 52 y 53"

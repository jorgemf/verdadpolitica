  - tipo: respaldo
    tema: economia-impuestos
    titulo: "La rebaja del IVA de los alimentos de 2023 llegó casi entera a los precios; la mitad del ahorro fue al 40 % más rico"
    texto: "La medida 180 promete, «mientras persista la actual crisis de inflación», un IVA del 0 % a los alimentos básicos, «incluidos la carne, el pescado y las conservas». La rebaja aplicada en España desde enero de 2023 se trasladó a los precios: un documento de trabajo del Banco de España con precios diarios de un supermercado la estima «casi completa», y la CNMC no halló «problemas sistemáticos» en la traslación. Límites: Fedea estimó un coste de unos 700 millones para aquella rebaja, con cerca de la mitad del ahorro para el 40 % de hogares con más renta, porque es una medida general y no focalizada. La de 2023 no incluía la carne ni el pescado, que hoy tributan al 10 %, por lo que la del programa sería más amplia y más costosa, y su efecto con esos productos no se ha medido."
    medidas: "medida 180"

  - tipo: choque
    tema: inmigracion
    titulo: "Priorizar ayudas por arraigo choca con la igualdad de trato de la UE si perjudica a residentes de otros países"
    texto: "La medida 98 fija «criterios de prioridad en el acceso a determinadas ayudas, prestaciones y recursos públicos» para quienes tengan «un arraigo real, duradero y verificable con España», valorando el empadronamiento y la cotización, y añade que se aplicarán «dentro de los límites constitucionales y europeos». La Directiva 2003/109/CE (art. 11) obliga a tratar como a los nacionales a los residentes de larga duración en seguridad social, asistencia social y acceso a la vivienda, y el Reglamento 492/2011 (art. 9) da a los trabajadores de la UE igual derecho a las listas de vivienda. La Comisión Europea respondió en 2026, sobre criterios de este tipo pactados por PP y Vox en varias comunidades, que son discriminatorios si perjudican a los nacionales de otros países, «a menos que esté justificada y sea proporcionada». Límite: el programa no concreta las ayudas ni el peso de cada criterio."
    medidas: "medida 98"

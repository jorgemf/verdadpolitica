  # ── Choque ──────────────────────────────────────────────────────────────────
  - tipo: choque
    tema: economia-impuestos
    titulo: "El programa no cuantifica su coste total ni cómo encaja en las reglas fiscales europeas"
    texto: "El programa no incluye una memoria económica con el coste de sus medidas ni su efecto sobre el déficit y la deuda. España cerró 2025 con un déficit del 2,18 % del PIB (2,39 % con las medidas por la DANA) y una deuda del 100,7 %. Con una deuda superior al 90 %, el Reglamento (UE) 2024/1263 exige que la senda de ajuste la reduzca una media mínima de un punto del PIB al año (art. 7) y alcanzar un margen de 1,5 puntos de déficit estructural por debajo del 3 % (art. 8). Entre sus medidas de mayor coste previsible están sus suelos de gasto en sanidad («8 % del PIB»), educación («7 % del PIB en 2030») y vivienda («1 % del PIB anual»): unos 5,4 puntos más que el gasto de 2024 según Eurostat (6,5 % y 4,1 % en sanidad y educación), unos 92.000 millones al año con su equivalencia de 17.000 millones por punto, más el 3,5 % del PIB para la transición ecológica."
    medidas: "Apartados 1.1, 1.8, 2.4, 2.5, 5.1 y 11.1"
    fuentes:

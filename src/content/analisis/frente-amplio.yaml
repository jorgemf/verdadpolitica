  - tipo: choque
    tema: economia-impuestos
    titulo: "La financiación directa del BCE a los Estados que propone el programa la prohíbe el art. 123 del Tratado de la UE"
    texto: "El programa propone: «Habilitaremos al BCE para la financiación directa a los Estados miembros de la UE, evitando que los países tengan que acudir a colocar su deuda pública en los mercados». El art. 123 del Tratado de Funcionamiento de la UE prohíbe que el BCE y los bancos centrales nacionales den créditos a los gobiernos o les compren deuda directamente. Cambiarlo exige reformar los Tratados por el art. 48 del Tratado de la UE, con ratificación de todos los Estados; España no puede hacerlo sola. El programa también reformaría el art. 135 CE para que las sendas de estabilidad no se apliquen mientras el paro supere la media de los cinco países de la UE con menos desempleo: en 2025 era del 10,5 % en España y de entre el 2,8 % y el 3,8 % en esos cinco (Eurostat). Esa reforma no exime a España de las reglas fiscales de la UE (art. 126 del Tratado)."
    medidas: "Bloque «La seguridad humana: paz, solidaridad y Europa» (p. 163) y reforma del art. 135 CE (p. 169)"

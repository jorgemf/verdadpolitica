  - tipo: respaldo
    tema: economia-impuestos
    titulo: "Un impuesto de patrimonio armonizado evita los traslados entre comunidades que restan recaudación, según un estudio"
    texto: "El programa propone que «todos los patrimonios de más de un millón de euros tributen como mínimo un 2 %» en toda España y una «Tasa Zucman» del 3 % anual sobre lo que supere los 50 millones. Con datos españoles, Agrawal, Foremny y Martínez-Toledano (2025) hallan que, al recuperarse el impuesto en todas las comunidades salvo Madrid, hubo traslados de contribuyentes a esa comunidad, con una pérdida de IRPF seis veces mayor que la de Patrimonio, y que Madrid recaudaría más con un tipo armonizado. Con datos de Suecia, Jakobsen, Kleven y otros (2024) estiman que cada punto más de tipo reduce un 2 % el número de grandes contribuyentes residentes, con un efecto pequeño sobre el empleo (0,02 %) y el valor añadido (0,10 %). Límites: armonizar dentro de España no impide la salida al extranjero, y ninguno de los dos estudios evalúa tipos del 2 % o el 3 %."
    medidas: "Apartado 3.2 (p. 51)"
    fuentes:

  - tipo: respaldo
    tema: empleo-pensiones
    titulo: "Los ensayos de semana de cuatro días sin rebaja salarial mejoraron el bienestar en las empresas que participaron"
    texto: "El programa propone la «implantación inmediata a 37,5 horas en 2026» y reducir la jornada «de forma progresiva hasta las 32 horas semanales» sin reducción salarial. Un estudio en Nature Human Behaviour (Fan, Schor y otros, 2025) con 2.896 empleados de 141 organizaciones de seis países halló, tras seis meses de semana de cuatro días sin rebaja de sueldo, menos agotamiento y más satisfacción y salud, algo que no se vio en 12 empresas de control. Límites: las empresas se presentaron voluntarias y reorganizaron el trabajo antes; los ensayos no miden el efecto de una reducción obligatoria. Los estudios de reducciones legales en Francia (35 horas) y Portugal (40 horas) no hallan que crearan empleo (Chemin y Wasmer, 2009; Raposo y van Ours, 2010)."
    medidas: "Apartado 4.1 (pp. 62-63)"
    fuentes:
      - titulo: "Work time reduction via a 4-day workweek finds improvements in workers' well-being"
        url: https://www.nature.com/articles/s41562-025-02259-6
        medio: "Nature Human Behaviour"
        fecha: 2025-07-21
        tipo: academica
      - titulo: "Using Alsace-Moselle Local Laws to Build a Difference-in-Differences Estimation Strategy of the Employment Effects of the 35-Hour Workweek Regulation in France (Chemin y Wasmer)"
        url: https://econpapers.repec.org/RePEc:ucp:jlabec:v:27:y:2009:i:4:p:487-524

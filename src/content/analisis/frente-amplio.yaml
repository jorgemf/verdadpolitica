  # ── Incoherencia ────────────────────────────────────────────────────────────
  - tipo: incoherencia
    tema: vivienda
    titulo: "125.000 viviendas públicas al año no alcanzan la media europea en la legislatura ni el 20 % del parque en 2035"
    texto: "El apartado 1.1 promete incorporar «1,5 millones de viviendas públicas en 12 años (125.000 viviendas públicas/año), alcanzando la media europea (9,3 %) durante la legislatura y el 20 % del parque total en 2035». Según el Censo de 2021 (INE) hay 26,6 millones de viviendas, 18,5 millones de ellas principales, y el Banco de España cifra el alquiler social en unas 300.000. A 125.000 al año, al final de una legislatura de cuatro años habría unas 800.000 viviendas públicas (el 4,3 % de las principales y el 3 % del total) y en 2035, unos 1,4 millones (el 7,7 % y el 5,4 %). El 20 % del parque total serían unos 5,3 millones. Las tres metas de la misma medida no pueden cumplirse a la vez: el ritmo anual previsto se acerca a la media europea al cabo de los 12 años, como estima el Banco de España para 1,5 millones de viviendas."
    medidas: "Apartado 1.1 (p. 14)"
    fuentes:

        url: https://diposit.ub.edu/items/d3c4aa85-2611-4969-a7af-5df2aa6e070d/full
        medio: "Universitat de Barcelona (repositorio)"
        tipo: academica
      - titulo: "Taxing Top Wealth: Migration Responses and their Aggregate Economic Implications (NBER Working Paper 32153)"
        url: https://nber.org/papers/w32153

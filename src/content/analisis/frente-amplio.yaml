  - tipo: incoherencia
    tema: economia-impuestos
    titulo: "La candidatura cifra en 10.000 millones lo que recaudan sus tres impuestos y en 20.000 millones dos medidas de pensiones"
    texto: "El programa afirma que «los derechos se sostienen con justicia tributaria» y que su reforma fiscal hará que «el nuevo esfuerzo tributario» recaiga sobre grandes empresas, banca y grandes fortunas. El 24 de octubre la candidatura cifró en «unos 20.000 millones al año» la pensión mínima igual al SMI y la jubilación a los 65 años, que el programa recoge, y atribuyó hasta 10.000 millones solo a un tipo mínimo del 15 % en Sociedades. El 5 de noviembre, al presentar el impuesto del 2 % y el 3 % a los patrimonios, la subida a grandes empresas y banca y el impuesto a la acumulación de viviendas, cifró el conjunto en «10.000 millones de euros más al año» para vivienda, servicios públicos, pensiones y tren. Con sus propias cifras, esos impuestos cubren la mitad de dos medidas de pensiones; el programa asigna además 17.000 millones al año a vivienda. El déficit de 2025 fue de 36.780 millones."
    medidas: "Introducción (p. 11) y apartados 1.8, 3.1, 3.2 y 4.3"

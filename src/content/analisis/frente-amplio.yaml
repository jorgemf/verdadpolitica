  - tipo: respaldo
    tema: empleo-pensiones
    titulo: "Las subidas del SMI elevaron los salarios bajos; sobre el empleo, los estudios van de un efecto marginal a uno negativo"
    texto: "El programa propone un «suelo legal del SMI al 60 % del salario medio neto» (apartado 4.1). Los estudios sobre la subida del 22,3 % de 2019 coinciden en que elevó los ingresos de los trabajadores con salarios bajos, pero discrepan sobre el empleo. El Banco de España (Barceló y otros, 2021) halló un menor crecimiento del empleo de los afectados, más acusado entre jóvenes y mayores, y pide interpretar sus cifras con cautela. Fedea (Casanova y otros, 2025) estima unos 5 puntos menos de crecimiento del empleo en los establecimientos con toda la plantilla afectada, concentrados en los de hasta cinco trabajadores. La comisión asesora del Ministerio de Trabajo (2022) concluyó que hubo, «a lo más, una pequeña reducción de su crecimiento»."
    medidas: "Apartado 4.1 (p. 62)"
    fuentes:

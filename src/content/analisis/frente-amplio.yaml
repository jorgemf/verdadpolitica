  - tipo: respaldo
    tema: sanidad
    titulo: "El impuesto catalán a las bebidas azucaradas redujo sus compras un 7,7 %, según un estudio publicado en 2020"
    texto: "El programa propone «impuestos específicos a bebidas energéticas, refrescos azucarados, tabaco y productos ultraprocesados» cuya recaudación se destine a salud. Cataluña aplica desde mayo de 2017 un impuesto de 0,08 a 0,12 euros por litro según el contenido de azúcar. Vall Castelló y López Casasnovas (Economics & Human Biology, 2020) estiman que redujo las compras de bebidas azucaradas un 7,7 %, más en las de mayor contenido de azúcar y en las zonas con más obesidad. Límites: parte de la caída se compensó con más ventas de bebidas «zero» o «light»; el estudio mide ventas, no efectos sobre el peso o la salud, y trata de una sola comunidad. El programa no define el impuesto a los ultraprocesados, sobre el que no hay evaluaciones comparables en España."
    medidas: "Apartado 2.4, «Salud pública» (p. 35)"
    fuentes:
      - titulo: "Impact of SSB taxes on sales (Economics & Human Biology, vol. 36, 2020)"
        url: https://diposit.ub.edu/dspace/handle/2445/159797?mode=full
        medio: "Universitat de Barcelona (repositorio)"
        tipo: academica
      - titulo: "Un programa como una casa. Programa electoral de Frente Amplio para las elecciones generales del 29 de noviembre de 2026"
        url: https://frenteamplio.info/pdf/ProgramaFrenteAmplio.pdf
        medio: "Frente Amplio"
        fecha: 2026-11-16

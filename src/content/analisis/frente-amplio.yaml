  - tipo: incoherencia
    tema: energia-medioambiente
    titulo: "El programa destina «íntegramente» el gravamen a las energéticas a una ayuda de 1.000 euros y también a pagar luz gratis"
    texto: "El apartado 3.1 recupera el gravamen del 1,2 % sobre la cifra de negocios de las grandes energéticas y dice: «Destinaremos íntegramente la recaudación del gravamen energético a financiar una ayuda directa de 1.000 euros por hogar durante dos años, beneficiando a 1,4 millones de familias»; son unos 1.400 millones al año. El apartado 5.1, sobre las «tres horas diarias gratuitas» de luz, añade: «Los peajes de red de esas horas se pagarán con el gravamen a las grandes energéticas». Hacienda estimó en 2023 que el gravamen recaudaría unos 1.700 millones al año, tras las exclusiones aprobadas en su tramitación. Si la ayuda absorbe toda la recaudación, no queda nada para los peajes. El programa no cuantifica esos peajes y prevé además deducciones por activos renovables que reducirían lo recaudado."
    medidas: "Apartados 3.1 (p. 50) y 5.1 (p. 72)"

  - tipo: choque
    tema: vivienda
    titulo: "Expropiar viviendas exige indemnizar su valor real (art. 33.3 CE) y limitar quién compra debe ser proporcionado (TJUE)"
    texto: "El programa prevé una «Ley de Expropiación de Viviendas a Propietarios Corporativos Privados» en tres fases (más de 1.000, 700 y 50 viviendas) y prohibir de forma «absoluta» que las personas jurídicas con ánimo de lucro compren vivienda. Ada Colau dijo el 10 de noviembre que se pagaría «a un precio muy inferior» al de mercado. El art. 33.3 CE exige causa de utilidad pública o interés social e indemnización, y el Constitucional (STC 166/1986) dijo que esta debe corresponder al «valor real» del bien, con un «proporcional equilibrio». El TEDH admite pagar menos que el valor de mercado en reformas de justicia social (James c. Reino Unido, 1986), pero no sin relación razonable con el valor. El TJUE (Libert, 2013) considera que condicionar quién compra inmuebles restringe las libertades de la UE; lo admite por vivienda social solo si se ciñe a proteger a quien lo necesita."
    medidas: "Apartados 1.1 (p. 14) y 1.2 (p. 15)"

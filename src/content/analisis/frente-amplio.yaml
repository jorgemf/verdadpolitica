  # ── Respaldo ────────────────────────────────────────────────────────────────
  - tipo: respaldo
    tema: vivienda
    titulo: "El Banco de España recomienda ampliar el alquiler social, que en España es menos del 2 % del parque según la OCDE"
    texto: "El programa destina «el 1 % del PIB anual (aprox. 17.000 M€/año)» a un parque público que incorporaría «1,5 millones de viviendas públicas en 12 años». El Banco de España (Informe Anual 2023) sitúa el alquiler social en unas 300.000 viviendas, el 1,5 % de las principales, y recomienda «impulsar la oferta de alquiler social»; calcula que converger con la media de la UE exigiría unos 1,5 millones de viviendas nuevas, la cifra del programa. La OCDE estima el parque social en el 8 % de las viviendas de la UE, más del 20 % en Austria, Dinamarca y Países Bajos, y menos del 2 % en España. Límites: según el Banco de España, hacerlo en 10 años exigiría producir más de un 150 % más viviendas al año que la media reciente, y estas fuentes describen la escasez del parque, no miden cuánto bajarían los alquileres."
    medidas: "Apartados 1.1 (p. 14) y 1.8"
    fuentes:

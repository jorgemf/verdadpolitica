  - tipo: choque
    tema: energia-medioambiente
    titulo: "Cerrar las nucleares supone más gas y emisiones a corto plazo; a largo plazo depende de la inversión renovable"
    texto: "El apartado 5.1 dice: «Almaraz I y II cerrarán en los plazos previstos (2027-2028)»; la Orden TED/864/2026 los prorrogó hasta junio de 2030, y habría que revocarla. La Agencia Internacional de la Energía (2019) concluye que alargar la vida de un reactor es considerablemente más barato que construir una central nueva y competitivo con la solar y la eólica nuevas. Una simulación del mercado ibérico (Fabra, 2026) estima que prorrogar Almaraz bajaría a corto plazo los precios mayoristas y las emisiones al desplazar gas, pero reduciría los incentivos a invertir en renovables y almacenamiento; si esa inversión cae lo bastante, acabaría elevando precios y emisiones. En Alemania, el cierre nuclear se cubrió sobre todo con carbón e importaciones, con un coste social de 3.000 a 8.000 millones de euros al año (Jarvis, Deschenes y Jha, 2022)."
    medidas: "Apartado 5.1 (p. 72)"

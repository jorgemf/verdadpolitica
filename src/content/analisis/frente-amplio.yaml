  - tipo: choque
    tema: empleo-pensiones
    titulo: "El programa blinda el IPC en la Constitución y adelanta la jubilación; la AIReF ve tensiones de sostenibilidad"
    texto: "El apartado 4.3 propone llevar a la Constitución el derecho a la pensión pública y «su revalorización automática con arreglo al IPC», que ninguna pensión sea inferior al SMI y devolver la edad de jubilación a los 65 años; la candidatura cifró en «unos 20.000 millones al año» estas dos últimas medidas. La AIReF (mayo de 2026) estima un gasto bruto en pensiones del 14,6 % del PIB de media en 2022-2050 y un gasto neto de los nuevos ingresos del 13 %, por debajo del umbral legal del 13,3 %, pero avisa de que ese cumplimiento no garantiza la sostenibilidad y de que, a políticas constantes, la deuda llegaría al 123 % del PIB en 2050. Con la revalorización en la Constitución, una ley ordinaria ya no podría cambiar ese parámetro si hubiera que corregir el gasto."
    medidas: "Apartado 4.3 (p. 64)"

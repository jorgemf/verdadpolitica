  # ── Choque ──────────────────────────────────────────────────────────────────
  - tipo: choque
    tema: economia-impuestos
    titulo: "El programa no cuantifica su coste total ni cómo encaja en las reglas fiscales europeas"
    texto: "El programa no incluye una memoria económica con el coste de sus medidas ni su efecto sobre el déficit y la deuda. España cerró 2025 con un déficit del 2,18 % del PIB (2,39 % con las medidas por la DANA) y una deuda del 100,7 %. Con una deuda superior al 90 %, el Reglamento (UE) 2024/1263 exige que la senda de ajuste la reduzca una media mínima de un punto del PIB al año (art. 7) y alcanzar un margen de 1,5 puntos de déficit estructural por debajo del 3 % (art. 8). Entre sus medidas de mayor coste previsible están movilizar cada año el 1 % del PIB para vivienda (unos 16.900 millones con el PIB de 2025, aunque incluye préstamos y avales del ICO, medida 38), la prestación universal por crianza (192), el crédito fiscal reembolsable por hijo (134), el Plan Sonríe (137) y el 0,7 % de la RNB en ayuda al desarrollo (459). Promete un plan fiscal compatible con las reglas (125), sin cifras."
    medidas: "medidas 38, 125, 134, 137, 192 y 459"

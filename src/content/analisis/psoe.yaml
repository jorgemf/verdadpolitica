  - tipo: choque
    tema: vivienda
    titulo: "Las ayudas a la compra tienden a subir precios donde la oferta es rígida, según el Banco de España y el caso británico"
    texto: "El programa propone ampliar la línea TU CASA «en caso de que se agoten los 10.000 millones» (67): préstamos públicos sin intereses de hasta el 20 % del valor de la primera vivienda, con un máximo de 50.000 euros (RDL 29/2026). El Banco de España (Informe Anual 2023) advierte de que, con una oferta rígida, las políticas de apoyo a la compra «suelen generar un aumento de los precios de compraventa». El programa británico Help to Buy, un préstamo público del 20 % del precio (40 % en Londres), subió los precios en Londres sin aumentar la construcción; cerca de la frontera con Gales, con oferta más flexible, aumentó la construcción sin efecto apreciable en los precios (Carozzi, Hilber y Yu, 2024). A diferencia de aquel, TU CASA limita para siempre el precio de reventa de las viviendas financiadas."

  - tipo: incoherencia
    tema: economia-impuestos
    titulo: "Promete mantener la inversión tras los fondos europeos y bajar el déficit, con el gasto ya por encima del límite"
    texto: "El programa admite que la legislatura «será más exigente, puesto que terminan los fondos Next Generation EU», y promete a la vez «una senda decreciente» de deuda y déficit (126), un gasto neto «compatible con las reglas fiscales europeas» (125), mantener «el esfuerzo de inversión pública» tras los fondos (128) y movilizar cada año el 1 % del PIB para vivienda (38). El gasto financiado por la UE no computa en la regla europea de gasto neto; el que lo sustituya con recursos propios, sí. La AIReF prevé que, a políticas constantes, ese gasto crezca un 5,8 % en 2026, frente al 3,5 % pactado con Bruselas, y que hagan falta ajustes del 0,6 % del PIB en 2026 para no superar el límite acumulado. Su directora de Análisis Económico dijo en mayo de 2026 que queda «muy poco margen» para que el sector público supla esos fondos. No detalla qué ingresos o recortes harían compatibles esos compromisos."
    medidas: "medidas 38, 125, 126 y 128"
    fuentes:

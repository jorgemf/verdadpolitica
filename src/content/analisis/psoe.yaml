  - tipo: respaldo
    tema: regeneracion-democratica
    titulo: "La Comisión Europea recomienda a España un registro obligatorio de lobbies y separar el mandato del fiscal general"
    texto: "El programa propone una ley de grupos de interés «con registro obligatorio, publicidad de sus reuniones y huella normativa» (446), una Agencia Independiente de Integridad Pública (445) y un mandato de cinco años para la Fiscalía General «desvinculado de la legislatura» y sin instrucciones del Gobierno en casos concretos (436). Coinciden con las recomendaciones del Informe sobre el Estado de Derecho 2026 de la Comisión Europea (17 de julio de 2026), que pide a España aprobar la ley de lobbies con un registro público obligatorio, separar el mandato del fiscal general del del Gobierno y garantizar la independencia del órgano que supervise los conflictos de interés. La Comisión vio progresos «limitados» en lobbies y conflictos de interés porque esos proyectos no se aprobaron; caducaron con la disolución. Es un respaldo institucional, no una medición de efectos."
    medidas: "medidas 436, 445 y 446"
    fuentes:
      - titulo: "2026 Rule of Law Report. Country Chapter on the rule of law situation in Spain (SWD(2026) 909)"
        url: https://commission.europa.eu/document/download/82ce1391-cde5-49e9-9d1b-3f14f4975eb7_en?filename=Country%20chapter%20-%20Spain%20-%20EN.pdf

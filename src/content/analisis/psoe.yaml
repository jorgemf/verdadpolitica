  - tipo: choque
    tema: empleo-pensiones
    titulo: "El programa blinda el IPC en la Constitución; la AIReF ve tensiones de sostenibilidad aunque se cumpla la regla de gasto"
    texto: "El programa propone «blindar constitucionalmente el sistema público de pensiones y su revalorización conforme al IPC» (100 y 365). Esa revalorización la fija hoy la Ley 21/2021, que derogó el índice de revalorización de 2013. La AIReF (mayo de 2026) estima un gasto bruto en pensiones del 14,6 % del PIB de media en 2022-2050 y un gasto neto de los nuevos ingresos del 13 %, por debajo del umbral legal del 13,3 %, pero avisa de que ese cumplimiento no garantiza la sostenibilidad y de que, a políticas constantes, la deuda llegaría al 123 % del PIB en 2050. El BCE atribuye en parte a la reversión parcial de las reformas de 2011 y 2013 que el gasto previsto para España en 2070 sea 7 puntos mayor que en las proyecciones anteriores. Con la revalorización en la Constitución, una ley ordinaria ya no podría cambiar ese parámetro si hubiera que corregir el gasto."
    medidas: "medidas 100 y 365"

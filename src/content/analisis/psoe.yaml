  - tipo: respaldo
    tema: empleo-pensiones
    titulo: "Los ensayos de semana de cuatro días sin rebaja salarial mejoraron el bienestar en las empresas que participaron"
    texto: "El programa propone «completar la reducción de la jornada a 37,5 horas e incentivar los avances en la negociación colectiva hacia las 35 horas» (108). Un estudio en Nature Human Behaviour (Fan, Schor y otros, 2025) con 2.896 empleados de 141 organizaciones de seis países halló, tras seis meses de semana de cuatro días sin rebaja de sueldo, menos agotamiento y más satisfacción y salud, algo que no se vio en 12 empresas de control. Límites: las empresas se presentaron voluntarias y reorganizaron el trabajo antes; los ensayos no miden el efecto de una reducción obligatoria. Los estudios de reducciones legales en Francia (35 horas) y Portugal (40 horas) no hallan que crearan empleo (Chemin y Wasmer, 2009; Raposo y van Ours, 2010)."
    medidas: "medida 108"
    fuentes:

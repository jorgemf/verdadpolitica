  - tipo: respaldo
    tema: empleo-pensiones
    titulo: "Las subidas del SMI elevaron los salarios bajos; sobre el empleo, los estudios van de un efecto marginal a uno negativo"
    texto: "El programa propone «blindar por ley el SMI por encima del 60% del salario medio» (medida 87). Los estudios sobre la subida del 22,3 % de 2019 coinciden en que elevó los ingresos de los trabajadores con salarios bajos, pero discrepan sobre el empleo. El Banco de España (Barceló y otros, 2021) halló un menor crecimiento del empleo de los afectados, más acusado entre jóvenes y mayores, y pide interpretar sus cifras con cautela. Fedea (Casanova y otros, 2025) estima unos 5 puntos menos de crecimiento del empleo en los establecimientos con toda la plantilla afectada, concentrados en los de hasta cinco trabajadores. La comisión asesora del Ministerio de Trabajo (2022) concluyó que hubo, «a lo más, una pequeña reducción de su crecimiento». El programa no precisa si el 60 % se mide sobre el salario medio neto, como hace esa comisión, o sobre el bruto."
    medidas: "medida 87"

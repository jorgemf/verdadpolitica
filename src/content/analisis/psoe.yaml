  # ── Incoherencia ────────────────────────────────────────────────────────────
  - tipo: incoherencia
    tema: economia-impuestos
    titulo: "La prestación por crianza se pagaría con impuestos a grandes patrimonios; el tributo estatal recaudó 19 millones en 2025"
    texto: "El programa promete una prestación por crianza para «los 8 millones de niñas, niños y adolescentes», financiada con «la nueva tributación de los grandes patrimonios y rentas del capital» (192); según la medida 127, esa recaudación «contribuirá a financiar» la prestación, y la 126 promete «una senda decreciente» de deuda y déficit. El impuesto estatal de solidaridad de las grandes fortunas, complementario del de Patrimonio, recaudó 623 millones en 2023 y, tras reactivar varias comunidades el de Patrimonio, 37 millones en 2024 y casi 19 en 2025, según la Agencia Tributaria. El programa no fija la cuantía de la prestación ni estima lo que daría la subida del tipo sobre las rentas del capital (130). Como referencia, con los 7,96 millones de menores que cuenta el INE, cada 10 euros mensuales por menor cuestan unos 955 millones al año."
    medidas: "medidas 126, 127, 130 y 192"

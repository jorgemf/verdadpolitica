  - tipo: respaldo
    tema: vivienda
    titulo: "El Banco de España recomienda ampliar el alquiler social; llegar a la media europea exigiría 1,5 millones de viviendas"
    texto: "El programa propone «aumentar el parque de viviendas públicas y protegidas para alcanzar la media de los países de nuestro entorno» (medida 39) y un parque estatal de 100.000 viviendas (42). Según la OCDE, el alquiler social es de media el 7 % del parque de viviendas en la OCDE y el 8 % en la UE; supera el 20 % en Austria, Dinamarca y Países Bajos y no llega al 2 % en España. El Banco de España recomienda «impulsar la oferta de alquiler social», pero advierte de la escala: partiendo del 1,5 % de las viviendas principales, converger con la media supondría unos 1,5 millones de viviendas, y hacerlo en diez años, aumentar más de un 150 % la producción anual reciente. Las 100.000 viviendas estatales son menos del 7 % de esa cifra; el resto dependería de comunidades y ayuntamientos."
    medidas: "medidas 39, 41 y 42"

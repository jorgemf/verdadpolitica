  - tipo: respaldo
    tema: economia-impuestos
    titulo: "Las transferencias por hijo reducen la pobreza infantil según los datos de EE. UU. y las simulaciones para España"
    texto: "El programa propone una «prestación estatal por crianza para todos los hogares con menores de edad» (192) y convertir el mínimo por descendiente del IRPF en un «crédito fiscal reembolsable» para 2 millones de hogares que hoy no se benefician de él (134). España tenía en 2024 la segunda tasa de riesgo de pobreza o exclusión infantil de la UE, el 34,6 %, según Eurostat. En EE. UU., los créditos fiscales reembolsables sacaron de la pobreza a 9,6 millones de personas en 2021, con la ampliación temporal del crédito por hijo; tras su expiración, la tasa de pobreza infantil (medida suplementaria) pasó del 5,2 % en 2021 al 12,4 % en 2022, según la Oficina del Censo. Para España, una simulación de UNICEF citada por el Gobierno estima que una prestación de 200 euros al mes reduciría la pobreza infantil en más de 7 puntos. El efecto depende de la cuantía, que el programa no fija."
    medidas: "medidas 134 y 192"
    fuentes:

  - tipo: respaldo
    tema: energia-medioambiente
    titulo: "Según el Banco de España, el aumento de la eólica y la solar abarató más de un 40 % el precio mayorista de la luz"
    texto: "El programa propone llegar al «81% de generación eléctrica» renovable en 2030 (234) y acelerar el almacenamiento, la gestión de la demanda y las interconexiones (237). Un artículo del Banco de España (Quintana, 2024) estima que en el primer semestre de 2024 el precio mayorista fue más de un 40 % inferior al que habría habido con la generación eólica y solar de 2019, y que podría bajar hasta un 50 % adicional en 2030 con el despliegue previsto en el PNIEC. El estudio advierte de una «considerable incertidumbre» y de que el efecto no es lineal: cuando las renovables cubren toda la demanda de una hora, más generación ya no baja el precio. El informe final de ENTSO-E sobre el apagón del 28 de abril de 2025 lo atribuye a varios factores, entre ellos carencias en el control de tensión y de potencia reactiva; el programa no menciona el apagón ni el control de tensión."
    medidas: "medidas 234 y 237"

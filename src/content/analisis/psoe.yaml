  - tipo: incoherencia
    tema: economia-impuestos
    titulo: "Sánchez presenta un bono deporte de 200 euros como parte del programa, que no lo incluye"
    texto: "El 19 de noviembre, Pedro Sánchez anunció en un vídeo un «Bono Deporte» de 200 euros al año para jóvenes de 18 a 25 años y escribió: «No nos estamos tirando un triple, es nuestro programa electoral». El programa presentado el 15 de noviembre no contiene esa medida: su apartado de deporte (medidas 186 a 191) trata del Estatuto del Deportista, una estrategia contra el sedentarismo, la Ley de Mecenazgo y el deporte femenino, y el de juventud solo dice «promover el acceso a la cultura, el deporte y un ocio saludable» (380). Con los 4,31 millones de personas de 18 a 25 años que contaba el INE el 1 de enero de 2025, el bono costaría unos 860 millones de euros al año si lo pidieran todas; ni el anuncio ni el programa lo cuantifican ni dicen cómo se pagaría."
    medidas: "medidas 186 a 191 y 380"
